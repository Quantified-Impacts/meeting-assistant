name: Build and push server image

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yaml"]

permissions:
  contents: read

env:
  IMAGE: rg.fr-par.scw.cloud/company-services/meeting-assistant-server

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: ${{ secrets.SCW_ACCESS_KEY }}
          password: ${{ secrets.SCW_SECRET_KEY }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
